<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE600" />
      <stop offset="100%" stop-color="#FF9900" />
    </linearGradient>
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Power Shield Background -->
  <path d="M50 8 L82 20 V46 C82 66 68 84 50 92 C32 84 18 66 18 46 V20 Z" fill="url(#shieldGrad)" stroke="#00F0FF" stroke-width="2.5" />
  
  <!-- Inner Glow Ring -->
  <path d="M50 14 L76 24 V45 C76 61 64 77 50 84 C36 77 24 61 24 45 V24 Z" fill="url(#coreGlow)" />

  <!-- High Voltage Bolt -->
  <path d="M54 22 L32 50 H48 L44 78 L68 46 H52 L54 22 Z" fill="url(#boltGrad)" filter="url(#glow)" stroke="#FFF" stroke-width="1" />
</svg>