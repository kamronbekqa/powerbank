[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Netlify faqat frontend (static) ni host qiladi.
# Backendni Render Blueprint orqali deploy qiling. Netlify > Site configuration >
# Environment variables ichida VITE_API_URL ni Render service URL ga tenglang
# (masalan https://powerbank-eq86.onrender.com, oxirida slash bo'lmasin), keyin redeploy qiling.

[[redirects]]
  from = "/api/*"
  to = "https://powerbank-eq86.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
